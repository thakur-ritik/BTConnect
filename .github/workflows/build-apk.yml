name: Build debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Push build log to branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-log
          cp build.log build-log.txt 2>/dev/null || echo "No build.log" > build-log.txt
          git add build-log.txt
          git commit -m "Upload build log [skip ci]" || true
          git push -f origin build-log || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTConnect-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Release APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-debug
          name: BTConnect Debug APK
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
